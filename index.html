<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="phishinggame.css">
<title>Phishing Awareness Game</title>
</head>
<body>

  
<!-- FRONT PAGE -->
<div id="screen-home" class="screen active">
  <h1 class="game-title">
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<svg viewBox="0 0 600 300" class="title-svg">
  <defs>
    <!-- Top curve (big arch) -->
    <path id="curve1" d="M50,180 Q300,40 550,180" />
    <!-- Middle curve (gentle arch) -->
    <path id="curve2" d="M80,210 Q300,110 520,210" />
    <!-- Bottom curve (almost flat) -->
    <path id="curve3" d="M100,240 Q300,170 500,240" />
  </defs>
  <!-- PHISHING -->
  <text>
    <textPath href="#curve1" startOffset="50%" text-anchor="middle" class="title-phishing">
      PHISHING
    </textPath>
  </text>
  <!-- AWARENESS -->
  <text>
    <textPath href="#curve2" startOffset="50%" text-anchor="middle" class="title-awareness">
      AWARENESS
    </textPath>
  </text>
  <!-- GAME -->
  <text>
    <textPath href="#curve3" startOffset="50%" text-anchor="middle" class="title-game">
      GAME
    </textPath>
  </text>
</svg>
</h1>
  <h2 class="game-title2">Are you able to distinguish<br> a genuine email from<br> a phishing attempt?</h2>
  <div class="hero-row">
  <img src="images/pc-bobby.png" class="hero-img" width="350" height="350" alt="cartoon officer">
  <div id="qrcode"></div>
  <div class="speech-bubble">Scan Me!</div>
</div>
  <button class="btn btn-primary" id="start-btn">Start Training</button>
</div>


<!-- GAME SCREEN -->
<div id="screen-game" class="screen">
  <h2>Email Challenge</h2>
  <div class="email-card">
    <div class="email-header">
      <strong>From:</strong> <span id="from"></span><br>
      <strong>Subject:</strong> <span id="subject"></span>
    </div>
    <div id="body"></div>
  </div>
   <div class="choices">
      <button class="btn safe-btn" id="btn-safe">Legit</button>
      <button class="btn phish-btn" id="btn-phish">Phishing</button>
    </div>
    <div id="feedback"></div>
</div>


<!-- RESULTS SCREEN -->
<div id="screen-results" class="screen">
  <h2>Training Complete</h2>
  <div class="score-box">
    <p><strong>Score:</strong> <span id="final-score"></span></p>
    <p><strong>Accuracy:</strong> <span id="final-accuracy"></span></p>
    <p><strong>Best Streak:</strong> <span id="final-streak"></span></p>
  </div>
  <input id="player-name" maxlength="12" placeholder="Your name" />
  <button id="end-btn" class="btn fin-btn">Submit Score</button>
</div>

<!-- LEADERBOARD -->
<div id="screen-leaderboard" class="screen">
  <h2>Leaderboard</h2>
  <ol id="lb-list"></ol>
  <button id="lb-home-btn" class="btn btn-primary">Back to Start</button>
</div>

<!-- TIPS CARD -->
<div id="tips-card" class="hidden">
  <div class="tips-content">
    <h3>Tip</h3>
    <p id="tips-message"></p>
    <button class="btn tips-close" id="tips-close">Close</button>
  </div>
</div>

  
<!-- GAME SCRIPT EXTRAS -->
<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
<script src="phishing-game.js"></script>
<script>
  const qrCode = new QRCode(document.getElementById("qrcode"), {
    text: "https://pauleastham.github.io/phishing-awareness-game/",
    width: 128,
    height: 128,
    colorDark: "#000000",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.H
  });
</script>


<!-- POLICE ALERT -->
<div id="police-alert" class="police-alert"></div>
<audio id="siren-sound" src="siren/police-siren.mp3" preload="auto"></audio>
  
<audio id="correct-sound" src="siren/ding.mp3" preload="auto"></audio>
</body>
</html>
